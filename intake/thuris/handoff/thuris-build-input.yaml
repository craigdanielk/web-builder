  density:
    value: airy
    source: operator-approved upper-echelon luxury direction
  motion:
    intensity:
      value: subtle
      source: design specification
    character:
      value: Slow, weighted reveals; restrained fades and vertical translation; no bouncy easing, autoplay carousels, cursor
        gimmicks or aggressive parallax. Respect prefers-reduced-motion.
      source: design specification aligned to operator luxury direction
  image_direction:
    treatment:
      value: Cinematic product still life with deep violet-black glass, brushed champagne metal, charcoal/stone surfaces,
        warm directional highlights, deep controlled shadows and generous negative space. Botanical material appears as restrained
        evidence of origin, not wellness decoration.
      source: operator-approved bottle/CI direction plus homepage design discussion
    lighting:
      value: Low-key studio light; warm side/rim light on metal and glass; readable label plane; no blown highlights.
      source: design specification
    backgrounds:
      value: Obsidian, charcoal stone, smoked plum, near-black; occasional warm parchment product-detail surface.
      source: design specification
    do:
    - value: Make the bottle the hero object and preserve material realism.
      source: operator-approved luxury object positioning
    - value: Use macro details of glass thickness, cap finish, box texture and botanical material only when those details
        match the final production specification.
      source: operator-approved packaging focus
    - value: Keep UAE relevance sophisticated and indirect through fragrance culture, materiality and ritual.
      source: https://www.visitdubai.com/articles/oud-and-bakhoor
    dont:
    - value: No generic spa imagery, towels, candles, yoga poses, diffuser clichés or wellness stock photography.
      source: operator-declared rejection of commodity wellness positioning
    - value: No pseudo-Arabic ornament, mosque imagery, desert stereotypes, or unapproved Arabic calligraphy.
      source: 'brand strategy: culturally respectful UAE positioning'
    - value: No fake certification seals, medals, review stars, press logos or laboratory imagery.
      source: 'operator build rule: real proof only'
  brand_voice:
    value: Restrained, precise, sensory, provenance-first, assured without hype. Write like a fragrance house describing materials,
      not a wellness brand promising outcomes.
    source: operator-declared positioning and UAE cultural research
  content_tone:
    value: Short declarative lines, editorial pacing, specific nouns, minimal adjectives. Luxury comes from detail and restraint
      rather than superlatives.
    source: design/content strategy for this handoff
