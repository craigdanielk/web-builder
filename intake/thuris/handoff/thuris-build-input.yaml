    - name: Frankincense
      detail: Boswellia serrata · India · 10 ml
      price: AED 395
      source: OilGrow March 2026 price list supplied by operator + operator-approved financial model v9
    - name: Neroli
      detail: Citrus aurantium blossom · France · 10 ml
      price: AED 445
      source: OilGrow March 2026 price list supplied by operator + operator-approved financial model v9
    - name: Rose Geranium
      detail: Pelargonium graveolens · South Africa · 10 ml
      price: AED 395
