design_benchmark:
- url: https://amouage.com/en-ae
  take_from: House-level hierarchy, exceptional-product framing, generous editorial pacing, premium gifting cues and UAE/KSA
    luxury-commerce expectations. Do not copy its layouts or language.
  source: https://amouage.com/en-ae
- url: https://www.aesop.com/fragrance/marrakech-intense-eau-de-parfum/FR39.html
  take_from: Product-first storytelling, high information density without visual clutter, disciplined typography, clear price/size/add-to-cart
    structure, ingredient/usage disclosure and editorial image sequencing. Do not copy its layouts or language.
  source: https://www.aesop.com/fragrance/marrakech-intense-eau-de-parfum/FR39.html
- url: https://www.lelabofragrances.com/santal-33-147.html?size=100ml
  take_from: Restraint, strong product naming, personalization/detail hierarchy and confident whitespace. Do not copy its
    layouts or language.
  source: https://www.lelabofragrances.com/santal-33-147.html?size=100ml
market_cro_research:
  positioning_statement:
    text: THURIS is a limited botanical-oil house for fragrance-literate customers who value material, provenance, ritual
      and collectible presentation over mass-market wellness language.
    source: operator-declared upper-echelon UAE positioning + https://www.visitdubai.com/articles/oud-and-bakhoor
  primary_value_prop:
    text: Three origin-led botanical oils, presented as one numbered founding release.
    source: operator-approved three-product launch and 90-bottle opening model
  core_benefits:
  - text: Three clearly named botanicals with declared source countries.
    source: OilGrow March 2026 price list supplied by operator
  - text: A 10 ml format designed as a luxury object rather than a commodity essential-oil bottle.
    source: operator-approved packaging direction and product format
  - text: 'A launch cap of 90 filled bottles: 30 Frankincense, 30 Neroli and 30 Rose Geranium.'
    source: operator-approved financial planner v9 / current conversation
  - text: Available individually or as the complete three-bottle Founding Trio.
    source: operator-approved commercial model in this conversation
  market_context:
  - claim: Fragrance is a prominent part of Arabian life in Dubai, with oud and bakhoor embedded in personal scent and home/hospitality
      culture.
    source: https://www.visitdubai.com/articles/oud-and-bakhoor
  - claim: Dubai Municipality treats perfumes as consumer products subject to registration and health/safety controls for
      the local market.
    source: https://www.dm.gov.ae/dubai-municipalitys-montaji-app/
  competitors:
  - name: Delune Dubai
    usp: Premium pure-essential-oil presentation with batch-quality positioning; Neroli 10 ml is listed at AED 449 and was
      shown sold out in the cited page.
    source: https://delune.ae/products/neroli-pure-essential-oil
    how_thuris_wins: Do not claim product superiority. Differentiate through a tighter three-product founding edition, numbered
      scarcity, stronger object/packaging theatre and a frankincense-led house narrative.
    strategy_source: operator-approved brand and launch strategy
  - name: Nagaad
    usp: Frankincense-specialist assortment with multiple Boswellia species, accessible pricing and established customer-review
      volume; Carterii 10 ml is listed at AED 112 on the cited page.
    source: https://nagaad.ae/products/frankincense-carterii-essential-oil
    how_thuris_wins: Do not compete on breadth or therapeutic claims. Compete on restrained luxury presentation, a curated
      three-product edition and gift/collector appeal.
    strategy_source: operator-approved positioning; Nagaad source above
  - name: Aroma Tierra
    usp: Broad organic essential-oil catalogue, accessible price points and quick UAE delivery; Rose Geranium 10 ml is listed
      at AED 85 on the cited page.
    source: https://www.aromatierra.com/products/geranium-organic-essential-oil
    how_thuris_wins: Do not compete as a wellness catalogue. Position THURIS as a limited luxury house with fewer products,
      stronger art direction and collectible packaging.
    strategy_source: operator-approved positioning; Aroma Tierra source above
  - name: Amouage
    usp: High perfumery from Oman with strong regional heritage, exceptional extraits, attars, gifting and premium service.
    source: https://amouage.com/en-ae
    how_thuris_wins: Amouage is a benchmark, not a head-to-head target. THURIS differs through single-botanical-format products,
      lower entry format and a small founding release rather than composed fine fragrance.
    strategy_source: operator-approved product architecture + Amouage source above
  buyer_personas:
  - name: UAE fragrance connoisseur
    demographics: Affluent adult fragrance buyer in the UAE; exact age, gender split and income are UNKNOWN because THURIS
      has no first-party customer data yet.
    fear: Paying luxury pricing for commodity-grade oil or unsubstantiated marketing.
    wish: To discover a distinctive, beautifully presented aromatic material with a credible story and limited availability.
    hate: Wellness clichés, discount language, fake scarcity, fake science and generic amber-dropper packaging.
    trust_signals:
    - clear botanical name and source country
    - batch-specific documentation when available
    - transparent pre-order timing
    - premium physical presentation
    - clear cancellation/shipping terms
    purchase_triggers:
    - limited founding allocation
    - material/packaging quality
    - frankincense/incense cultural resonance
    - gifting suitability
    - provenance detail
    source: CRO hypothesis derived from operator-declared upper-echelon UAE ICP + https://www.visitdubai.com/articles/oud-and-bakhoor;
      no THURIS customer data yet
  - name: Luxury gifting buyer
    demographics: Adult UAE gifting buyer; exact demographic profile is UNKNOWN because THURIS has no first-party customer
      data yet.
    fear: A gift that feels generic, inexpensive or difficult to understand.
    wish: A compact, premium object with a strong presentation moment and a clear story.
    hate: Cheap promotional cues, cluttered packaging and unclear delivery dates.
    trust_signals:
    - presentation-box photography
    - clear inclusion list
    - gift-ready product presentation
    - dispatch window
    - secure checkout
    purchase_triggers:
    - Founding Trio
    - limited allocation
    - presentation quality
    - occasion-independent luxury
    source: 'CRO hypothesis from operator-declared luxury/gifting strategy; Amouage gifting benchmark: https://amouage.com/en-ae'
  - name: International niche-fragrance buyer
    demographics: Adult niche-fragrance customer; United States is the planned secondary market. Exact demographics are UNKNOWN
      because THURIS has no first-party customer data yet.
    fear: Unfamiliar brand, unclear product use and uncertain cross-border delivery.
    wish: A new house with a distinct point of view and transparent product detail.
    hate: Overclaiming, vague ingredients and hidden shipping/tax surprises.
    trust_signals:
    - exact product naming
    - transparent origin
    - clear product classification/use instructions
    - shipping/tax clarity
    - straightforward pre-order policy
    purchase_triggers:
    - new-house discovery
    - limited edition
    - design quality
    - product specificity
    source: 'CRO hypothesis from operator-declared US expansion target; regulatory claim caution: https://www.fda.gov/cosmetics/cosmetic-products/aromatherapy'
  preorder_objections:
  - question: Why pre-order instead of buying in stock?
    answer: The Founding Edition is planned as a capped opening release. Pre-ordering reserves stock from that opening allocation
      before dispatch.
    source: operator-approved limited-release/pre-order strategy and 90-bottle financial model
  - question: When will my order ship?
    answer: UNKNOWN
    reason: No defensible dispatch window has been approved. Do not open paid pre-orders until one exists.
    source: 'operator-declared gap; US timing baseline: https://www.ftc.gov/legal-library/browse/rules/mail-internet-or-telephone-order-merchandise-rule'
  - question: What exactly am I buying?
    answer: 'A 10 ml THURIS botanical oil in one of three editions: Frankincense, Neroli or Rose Geranium; the complete Founding
      Trio contains one of each.'
    source: OilGrow March 2026 price list supplied by operator + operator-approved three-product commercial model
  - question: Is this an eau de parfum?
    answer: No. THURIS is launching these products as 10 ml botanical oils, not eau de parfum.
    source: operator-approved product architecture / supplier product format
  - question: Can I apply it directly to my skin?
    answer: UNKNOWN
    reason: Final directions for use must follow product classification and batch-specific safety documentation.
    source: https://www.fda.gov/cosmetics/cosmetic-products/aromatherapy
  - question: How do I know the oils are pure?
    answer: THURIS will not publish a purity claim until batch-specific supplier documentation supports it. The supplier states
      that certificates of analysis are available on request, but those batch documents are not yet in the build input.
    source: OilGrow March 2026 price list supplied by operator
  - question: What does “Standardised” mean for the Neroli?
    answer: UNKNOWN
    reason: The supplier uses “Standardised” in its price list, but the formulation meaning has not yet been clarified. This
      must be resolved before product-detail copy is final.
    source: OilGrow March 2026 price list supplied by operator
  - question: Can I cancel a pre-order?
    answer: UNKNOWN
    reason: Exact operator-approved cancellation/refund terms have not been finalised.
    source: 'operator-declared gap; US delay/refund baseline: https://www.ftc.gov/legal-library/browse/rules/mail-internet-or-telephone-order-merchandise-rule'
  - question: Where do you ship?
    answer: UNKNOWN
    reason: No approved 3PL/carrier/compliance shipping matrix exists.
    source: operator-declared gap
  - question: Are duties and taxes included?
    answer: UNKNOWN
    reason: No approved tax/importer-of-record/landed-duty treatment exists.
    source: operator-declared gap
  proof:
    value: NONE
    reason: THURIS is a pre-launch brand with no approved customer reviews, beta quotes, press, awards or brand-level certifications.
      Supplier claims are not THURIS proof and must not be presented as such.
    source: 'operator-declared pre-launch state and build rule: REAL ONLY'
