  - value: cures
    source: https://www.fda.gov/cosmetics/cosmetic-products/aromatherapy
  - value: treats
    source: https://www.fda.gov/cosmetics/cosmetic-products/aromatherapy
  - value: anti-inflammatory
    source: https://www.fda.gov/cosmetics/cosmetics-laws-regulations/it-cosmetic-drug-or-both-or-it-soap
  - value: anxiety relief
    source: https://www.fda.gov/cosmetics/cosmetic-products/aromatherapy
  - value: sleep aid
    source: https://www.fda.gov/cosmetics/cosmetic-products/aromatherapy
  - value: immune support
    source: https://www.fda.gov/cosmetics/cosmetic-products/aromatherapy
  - value: medical
    source: https://www.fda.gov/cosmetics/cosmetics-laws-regulations/it-cosmetic-drug-or-both-or-it-soap
  prohibited_language:
  - value: Any statement that diagnoses, treats, prevents or cures disease, or claims to affect body structure/function.
    source: https://www.fda.gov/cosmetics/cosmetic-products/aromatherapy
  - value: Any unverified purity, organic, ethical-sourcing, sustainability, clinical, certification or testing claim.
    source: operator governance rule in current request; supplier batch evidence not yet provided
  - value: Any statement implying all three botanicals are South African.
    source: 'OilGrow March 2026 price list supplied by operator: Frankincense India; Neroli France; Rose Geranium South Africa'
  regulatory_body_licences:
  - body: Dubai Municipality — Montaji
    requirement: Fragrance products placed on the Dubai local market are subject to consumer-product registration; the applicant
      must hold a relevant UAE licence.
    status: UNKNOWN — applicant/importer and THURIS product registrations are not yet established.
    source: https://www.dm.gov.ae/wp-content/uploads/2022/07/DM-HSD-GU117-FP2_Technical-Guidelines-for-Fragrance-Products_V1.pdf
  - body: Dubai Municipality — consumer-product e-commerce/import controls
    requirement: Consumer products intended for Dubai are required to be registered before importation under the cited e-commerce
      guidance.
    status: UNKNOWN — route to market has not been finalised.
    source: https://www.dm.gov.ae/wp-content/uploads/2022/12/DM-HSD-GU18-ECOM2_Technical-Guidelines-for-Consumer-Products-E-Commerce_V1.pdf
  - body: United States FDA/FTC
    requirement: If marketed only as fragrance/cosmetic, claims must remain cosmetic; therapeutic claims can change regulatory
      status. Internet sellers must have a reasonable basis for stated ship timing and handle delays/refunds as required by
      the FTC rule.
    status: US is secondary market; compliance work not completed.
    source: https://www.fda.gov/cosmetics/cosmetic-products/aromatherapy ; https://www.ftc.gov/legal-library/browse/rules/mail-internet-or-telephone-order-merchandise-rule
