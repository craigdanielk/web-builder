  - id: founding-trio
    heading:
      text: The complete Founding Trio
      source: operator-approved collection architecture
    body:
      text: One of each 10 ml edition. Frankincense, Neroli and Rose Geranium presented together as the first THURIS collection.
      source: operator-approved collection architecture
    price:
      text: AED 1,111.50
      source: 'operator-approved financial model: AED 395 + AED 445 + AED 395 less 10% Founder Collection discount'
  - id: benefits
    heading:
      text: What defines the first release
      source: brand/content strategy for this handoff
    items:
    - text: Named botanical species and source country.
      source: OilGrow March 2026 price list supplied by operator
    - text: A 10 ml format across all three launch products.
      source: operator-approved product format / supplier price list
    - text: 'Ninety launch bottles: thirty of each botanical oil.'
      source: operator-approved financial model v9
    - text: Available individually or as the complete Founding Trio.
      source: operator-approved commercial model
