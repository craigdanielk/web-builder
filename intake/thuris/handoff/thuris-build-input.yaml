schema_version: '1.0'
build_target:
  value: Single-page headless Shopify pre-order site; Next.js on Vercel; Shopify Storefront API.
  source: operator-declared in current request
internal_build_directives:
- Do not render source metadata.
- Do not render UNKNOWN values as customer-facing copy.
- Do not enable checkout or publish the pre-order state while any launch_blocker is unresolved.
- Do not invent reviews, certifications, press, shipping dates, regulatory approvals, product claims, dimensions, weights,
  analytics IDs, access credentials, or domain ownership.
- Use the supplied SVG identity assets. Product media is generation-authorized but must follow assets/media-generation-brief.md
  and assets/alt-text-manifest.yaml.
launch_blockers:
- item: confirmed dispatch date/window
  reason: No production or fulfilment date has been approved.
  source: 'operator-declared: no ship date supplied in conversation'
- item: UAE product registration/import route
  reason: Dubai fragrance products intended for the local market must be registered in Montaji; registration/importing party
    is not yet identified.
  source: https://www.dm.gov.ae/wp-content/uploads/2022/07/DM-HSD-GU117-FP2_Technical-Guidelines-for-Fragrance-Products_V1.pdf
- item: batch-specific supplier documentation
  reason: COA/GC-MS and the exact meaning of the supplier term “Standardised” for Neroli have not been supplied to the build
    agent.
  source: OilGrow March 2026 price list supplied by operator; operator discussion in this conversation
- item: exact product usage/safety directions
  reason: Final product classification, formulation documentation and destination-market label review are incomplete.
  source: https://www.fda.gov/cosmetics/cosmetic-products/aromatherapy
- item: cancellation/refund policy approval
  reason: No final operator-approved cross-market policy has been supplied.
  source: 'operator-declared gap; US pre-order timing/refund baseline: https://www.ftc.gov/legal-library/browse/rules/mail-internet-or-telephone-order-merchandise-rule'
- item: shipping zones/rates/tax/payment gateway
  reason: No carrier, 3PL, gateway or landed-cost configuration has been approved.
  source: operator-declared gap
- item: Shopify/Vercel access
  reason: No THURIS store, Headless channel, Admin API app, or Vercel project access details have been supplied.
  source: operator-declared gap
- item: custom domain
  reason: No domain has been purchased/confirmed for THURIS.
  source: operator-declared gap
