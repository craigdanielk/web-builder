- id: aurelix.probe.corpus-archetypes
  name: Persisted-corpus archetype annotator
  kind: probe
  invocation: node scripts/quality/annotate-corpus-archetypes.js <corpus-dir> [--json] [--write] [--out
    <dir>]
  preconditions:
  - a persisted capture corpus directory holding index.json plus <slug>/extraction.json per page
  - nothing else — no network, no browser, no database. The corpus exists so the site is not re-measured
    on a different day
  inputs:
  - <corpus-dir>/index.json
  - <corpus-dir>/<slug>/extraction.json
  outputs:
  - 'stdout: the measured section sequence per page (or the whole result as JSON under --json)'
  - 'under --write: <slug>/extraction.json rewritten with archetype fields — in place, or into --out after
    copying the whole corpus there first'
  outcome: the reference section sequence a corpus actually contains, per page, with a confidence and
    method per section
  exit_contract:
    '0': every page classified. Sections below the mapper threshold are reported NOT_MEASURED — that is
      a measurement, not a failure
    '3': NOT_MEASURED — no page in the corpus carried any section at all
    '64': 'usage error: no corpus directory, an unknown flag, --out without a value, or no index.json
      at the given path'
  measures:
  - archetype and variant per section, with confidence and the method that produced it
  - the measured/not-measured split per page, and the minimum confidence across the page
  cannot_see:
  - whether the archetype label is RIGHT. It is the same annotateSectionArchetypes() call extract-reference.js
    makes, at the same threshold — it re-runs a classifier, it does not check one, so a systematic mapper
    error is reproduced here with a confidence score attached to it
  - whether the corpus is current. It reads persisted extraction.json and has no notion of when the site
    was captured or whether it has since changed — that staleness is the deliberate trade for not re-crawling,
    and it is invisible from inside this tool
  - a page listed in index.json whose extraction.json is missing — it records NOT_MEASURED for that slug
    and still exits 0 as long as one other page carried sections
  - sections the capture never persisted. It classifies data.sections as found; a page whose extractor
    dropped a section is indistinguishable here from a page that did not have one
  - whether anything consumes the annotation. --write persists it into the corpus, and no gate reads the
    archetype field back
  reachable_from:
  - scripts/test_corpus_archetypes.py:183,201,229
  - standalone CLI
  cost: <1s per corpus; filesystem only. --write --out copies the whole corpus first, so it costs its
    size on disk
  source_file: web-builder/scripts/quality/annotate-corpus-archetypes.js
  language: js
  status: VERIFIED
  evidence: ran `node scripts/quality/annotate-corpus-archetypes.js benchmarks/corpora/enterprise-stablecoin-payments-measured
    --json` → exit 0. 5 pages, 41 sections, 22 measured / 19 NOT_MEASURED
- id: aurelix.probe.preset-enrichment
  name: Preset claim vs live reference-site probe
  kind: probe
  invocation: node scripts/quality/enrich-preset.js <preset-name> [--output-dir <dir>] [--max-sites <n>]
  preconditions:
  - skills/presets/<preset-name>.md exists and lists reference sites
  - playwright with chromium installed — extract-reference.js launches a headless browser and nothing
    checks it first
  - outbound network access to the reference sites
  inputs:
  - skills/presets/<preset-name>.md
  - the live reference sites the preset names
  outputs:
  - <output-dir>/enrichment-report-<preset>.md — accuracy, confirmed claims, discrepancies, top fonts,
    discoveries
  - <output-dir>/<preset>/<host>/ — the raw per-site extraction from extract-reference.js
  outcome: how much of what a preset claims about its reference sites is true of those sites today, per
    claim, with the measured value beside the claimed one
  exit_contract:
    '0': the report was written. It exits 0 at ANY accuracy — 0% confirmed and 100% confirmed return the
      same code, because this reports and does not judge
    '1': no preset name given, the preset file does not exist, the preset lists no usable reference sites,
      every site failed to extract, or a fatal throw
  measures:
  - rendered fonts, text colours, background colours and border radii per reference site, from computed
    style in a real browser
  - frequency across sites — a token on 5 of 5 sites is reported differently from one on 1 of 5
  - match / mismatch / discovery against the preset's own claims, with a severity per mismatch
  cannot_see:
  - a site it failed to reach. Per-site failures are caught, pushed to failedSites and printed, and the
    accuracy figure is then computed over the survivors alone — a report saying "5 sites analyzed" where
    4 failed reads as a weaker claim, not as an unmeasured one, and still exits 0
  - whether the reference site is the one the preset meant. nameToUrl() GUESSES a URL from a prose name
    — it strips punctuation and appends .com — so a wrong-but-live domain is measured with full confidence
    and never flagged
  - whether the preset is wrong or the site changed. A discrepancy is reported as a discrepancy; which
    side moved is outside what it reads
  - 'anything a headless chromium at 1440x900 does not render: consent walls, geo-variant designs, A/B
    arms, authed and hover states'
  - whether anyone acts on it. It never edits the preset it grades, no caller invokes it beyond the npm
    alias, and no gate reads the report
  reachable_from:
  - scripts/quality/package.json — `npm run enrich`
  - standalone CLI
  cost: 'browser-bound: roughly 10-40s per reference site, default 5 sites. Requires network and an installed
    chromium'
  source_file: web-builder/scripts/quality/enrich-preset.js
  language: js
  status: NOT_RUN
  evidence: launches headless chromium against live third-party sites, 5 by default
- id: aurelix.probe.render-audit
  name: Post-build render audit (headless Chromium probe)
  kind: probe
  invocation: node scripts/quality/render-audit.js --base <url> (--routes <a,b,c> | --manifest <site-manifest.json>)
    --out <dir> [--viewport 1440x900] [--settle 2500]
  preconditions:
  - the site is already SERVED at --base (a local `npm run start` or a deployed URL) — this probe neither
    builds nor deploys
  - playwright with a chromium browser installed (`npx playwright install chromium`); its absence is a
    launch failure, not a measurement
  inputs:
  - every route reachable at <base><route>, from --routes or the non-dynamic pages of --manifest
  outputs:
  - <out>/render-audit.json — the DEFECT SUMMARY (counts by severity/category, per-page totals); `facts`
    are discarded here
  - <out>/report.json — schema aurelix.render_audit.v2, the raw per-route `facts` the summary throws away
  - <out>/render-<route>.png — one full-page screenshot per route
  - 'stdout: one JSON line {report, total_defects, by_severity} for the Python caller'
  outcome: 'what the built site actually paints per route: section boxes, image load state, nav reachability,
    measured contrast with a denominator, console errors and 4xx/5xx requests'
  exit_contract:
    '0': the audit RAN and both reports were written. It exits 0 whatever the defect count — this is a
      probe, not a gate, and the exit code carries no verdict
    '1': the probe itself failed (chromium would not launch, or an unhandled error)
    '2': usage — --base or --out missing
  measures:
  - 'per-section geometry and paint: height/width, opacity, visibility, textLen, a djb2 text fingerprint,
    own/child background image, per-section overflowX'
  - 'page box: scrollWidth vs clientWidth with a 1px tolerance — the horizontal-overflow measurement'
  - 'every <img>: naturalWidth/Height, rendered box, objectFit, load state; CSS background-image URLs
    are listed but their load state is recorded as null'
  - contrast on up to 400 text elements that own their text node, alpha-compositing every background layer
    up to the first opaque ancestor, with measured/passed/failed counts so a failure count has a denominator
  - header/nav hrefs against the known route set, console errors, and every response with status >= 400
  cannot_see:
  - 'any route it was not given: --manifest deliberately drops dynamic [handle] routes and not-found,
    so a broken product page is outside its world'
  - a permanently invisible reveal — before probing it injects `[style*="opacity"]{opacity:1!important}`
    to settle framer entrance animations, which also forces a genuinely stuck-at-0 element visible
  - 'zero-height sections as defects: blocks under 40px are recorded with belowThreshold=true and countedSections()
    keeps them out of every count and check'
  - whether a CSS background-image resolves — kind:'bg' records are pushed with loaded:null and nothing
    ever fetches them
  - 'contrast of text inside a fixed/sticky overlay whose backdrop resolves light: those elements are
    SKIPPED, because the DOM-ancestor walk cannot see what is visually behind them'
  - whether the content is TRUE. It measures paint, not provenance — a fabricated statistic renders perfectly
    and scores zero defects
  - 'anything that needs interaction: hover, modals, form states, authenticated pages. It loads, scrolls,
    and measures'
  reachable_from:
  - orchestrate.py:10002 (Stage 6 resolves the path) and orchestrate.py:10090 (subprocess.run, 180s timeout)
  - standalone CLI
  cost: roughly 10-20s per route (45s navigation timeout, --settle 2500ms, a scroll pass at 250ms per
    viewport, plus a full-page screenshot); requires a served site and a chromium download
  source_file: web-builder/scripts/quality/render-audit.js
  language: js
  status: VERIFIED
  evidence: ran `node scripts/quality/render-audit.js --base http://127.0.0.1:4791 --routes / --out /tmp/ra-out
    --settle 1500` → exit 0. exit 0 WITH total_defects 2 (1 critical, 1 high) - confirms the exit code
    carries no verdict
- id: aurelix.probe.shot-aa
  name: Full-page screenshot of a local HTML FILE, reveal-state neutralised
  kind: probe
  invocation: node scripts/quality/shot-aa.js <path-to-local.html> <out.png>
  preconditions:
  - playwright chromium installed
  - the FIRST argument is a filesystem path, not a URL — the script prefixes it with file:// itself, so
    passing an http(s) URL produces file://https://… and captures nothing useful
  - 'a single self-contained HTML file: file:// gives it no dev server, so a Next.js route cannot be shot
    this way'
  - the parent directory of <out.png> exists — it is not created
  inputs:
  - a local HTML file path
  outputs:
  - <out.png> — one full-page PNG at 1440x900, deviceScaleFactor 1
  outcome: a stitched full-page image of a local HTML file with GSAP/ScrollTrigger reveal state forced
    to its end position, so nothing is captured mid-fade
  exit_contract:
    '0': the PNG was written (see cannot_see — this includes a page that failed to load)
    '2': the browser launch, the screenshot, or the close threw
  measures:
  - the hydrated, reveal-completed rendering of one document at one viewport width (1440), full page height
  cannot_see:
  - 'ANY failure to load: the goto() rejection is swallowed by .catch(()=>{}), so a missing file, a broken
    path or a blank document is screenshotted and exits 0 — a written PNG is not evidence the page rendered'
  - more than one viewport — 1440x900 is hardcoded; it cannot answer whether the mobile breakpoint holds
    (that is shot-width.js)
  - 'the difference between server-rendered and client-inserted content: it captures the hydrated DOM
    after 2.5s, so JS-injected markup is indistinguishable from HTML that shipped'
  - anything behind an interaction — no click, hover, focus or menu-open state is exercised
  - 'lazy content that needs scrolling: unlike shot-live.js and shot-width.js it never scrolls, so an
    IntersectionObserver-loaded image below the fold is captured empty'
  - reveal machinery other than GSAP/ScrollTrigger and the `.rv` class — a Framer Motion or CSS-only reveal
    is not neutralised and can be caught mid-animation
  - 'anything about the image it wrote: it renders NO verdict, compares nothing, and asserts no dimension,
    colour or overflow property'
  reachable_from: []
  cost: one browser launch plus ~3s of fixed waits — roughly 5-15s
  source_file: web-builder/scripts/quality/shot-aa.js
  language: js
  status: VERIFIED
  evidence: ran `node scripts/quality/shot-aa.js /tmp/probe.html /tmp/aa.png` → exit 0. 48KB PNG
