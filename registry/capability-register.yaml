    static_signals, lint, canonical_bundle_resolver, notes} plus vite_config when detected
  - 'stdout: the absolute path of that JSON, and nothing else'
  outcome: the route list a crawl should seed from, and the source-level UX/a11y signals that no amount
    of crawling a rendered page can recover
  exit_contract:
