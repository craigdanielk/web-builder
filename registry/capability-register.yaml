      routes and a failing lint exits 0, and `lint.ok: false` lives inside the JSON, never in the exit
      code'
    '1': the resolved repo path is not a directory
    '2': 'the invocation could not be resolved to a repo or a canonical bundle dir: no cross-repo path
      for --target, no default_target in the registry, the default_target repo is absent on disk, or --repo
      matches no registry target and no --output-dir was given. argparse failures also land here'
  measures:
  - declared routes, including dynamic segments — [id], [...slug] and [[...slug]] are translated to URL
    patterns with a concrete hint path each
  - 'which framework the repo is, by evidence: Next.js App Router first, then react-router-dom, then `unknown`
    — it does not guess from package.json alone'
  - per-file static signals across every src/**/*.tsx
  - the lint run's real exit code, or the precise reason it was not invoked (no package.json, no lint
    script, npm absent, timeout, --skip-lint)
