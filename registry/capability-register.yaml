  - the blast radius of a role change. A role repaired for one selector on one route applies site-wide,
    including routes absent from this report
  - 'any contrast failure whose colour is not a token: a Tailwind utility (text-gray-900, text-white)
    is indexed to no palette role and is reported unrepairable, never repaired'
  - anything the probe did not measure — hover, focus and client-only states, text over images or gradients
    (the probe composites solid background layers only), and unvisited routes
  - 'whether it has ever run. reachable_from is [] as measured: no pipeline stage, no gate and no orchestrator
    call site invokes this file, so its verdict has never reached a build'
  reachable_from: []
  cost: <1s; pure arithmetic over an existing report. --apply writes two files and spends nothing
