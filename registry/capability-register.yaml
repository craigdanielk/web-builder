capabilities:
- id: aurelix.gate.compile
  name: TypeScript compile gate
  kind: gate
  invocation: node scripts/quality/compile-gate.js <site-dir> [--out <dir>]
  preconditions:
  - a generated site directory containing .ts/.tsx sources
  - a resolvable TypeScript compiler — local tsc, or one reachable from the site
  inputs:
  - the generated site directory
  outputs:
  - '<out>/compile-gate.json (default: the parent of <site-dir>)'
  outcome: whether the generated TypeScript actually parses, partitioned so a missing install cannot mask
    a syntax error
  exit_contract:
    '0': PASS — no structural errors
    '1': FAIL — TS1xxx structural (parse/syntax) errors present
    '3': NOT_MEASURED — no TypeScript compiler could be resolved, or tsc produced no diagnostics
  measures:
  - TS1xxx structural errors — the class that `key=` (a token substitution that ate its value) belongs
    to
  - module-not-found (TS2307 and friends) and everything else, reported but never fatal
  cannot_see:
  - type CORRECTNESS — the partition deliberately treats non-structural diagnostics as noise, so a site
    that parses but is deeply mistyped passes here
  - 'runtime behaviour: a file that compiles can still render nothing'
  - anything at all when it globs sources itself without a tsconfig.json and finds none — it returns "no
    .ts/.tsx sources found" and exits 3. Read compile-gate.json, not the summary line
  - whether the site was built; it type-checks source, and a stale .next is invisible to it
  reachable_from:
  - orchestrate.py:9370
  - run_pipeline.py:951
  - npm run compile-gate
  - standalone CLI
  cost: ~10-60s depending on site size; tsc timeout is 300s
  source_file: web-builder/scripts/quality/compile-gate.js
  language: js
  status: VERIFIED
  evidence: 'ran `node scripts/quality/compile-gate.js output/xago-exchange-mockup/site --out /tmp/cg-out`
    → exit 0. 2026-08-18 xago-exchange-mockup: PASS, 0 structural errors; resolved tsc from the site''s
    own node_modules'
- id: aurelix.gate.conformance
  name: Design conformance gate
  kind: gate
  invocation: node scripts/quality/conformance-gate.js --build-dir <site-dir> --benchmark <file> --output
    <dir>
  preconditions:
  - a production build exists (.next/ with a prerender-manifest) — this gate does not build
  - a ratified benchmark file; defaults to benchmarks/enterprise-payments-bvnk.json
  - python3 with the aurelix-uiux-audit analyser importable (conformance_runner.py drives it)
  inputs:
  - the built site directory
  - a benchmark json
  outputs:
  - <output>/conformance.json — violations carry {layer, rule, measured, expected, route, section}
  outcome: per-rule PASS/FAIL with measured vs expected, over every prerendered route of the built site
  exit_contract:
    '0': PASS — every measured rule conforms
    '1': FAIL — at least one rule failed WITH a measured value behind it
    '3': NOT_MEASURED — nothing could be measured, or the only failures had no measurement. NOT_MEASURED
      is not a pass
  measures:
  - 'computed style of the rendered page: type scale, shadow layers, palette size, spacing rhythm'
  - the whole prerendered route set, not a sampled page
  cannot_see:
  - source-level token drift — it reads computed style, so a template that hardcodes a literal matching
    the benchmark passes here while still being unmaintainable
  - 'anything not rendered on a prerendered route: client-only states, hover, modals, authed pages'
  - WHERE an offence is. The dna_* rules are site-level aggregates; evaluate() flattens per_page and stamps
    pages[0] onto every record, so route and section are reported null rather than invented
  - whether the benchmark itself is right — a wrong ratified benchmark produces confident conformance
  reachable_from:
  - orchestrate.py:9867
  - run_pipeline.py:992
  - standalone CLI
  cost: ~30s on a 65-route site, plus the production build it requires
  source_file: web-builder/scripts/quality/conformance-gate.js
  language: js
  status: VERIFIED
  evidence: 'ran `node scripts/quality/conformance-gate.js --build-dir output/xago-exchange-mockup/site
    --benchmark benchmarks/enterprise-payments-bvnk.json --output /tmp/conf-out` → exit 1. 2026-08-18
    xago-exchange-mockup: FAIL, 9 violations / 1 conform over 13 routes. A dark site measured against
    a light benchmark, so the palette-role failures are a benchmark mismatch, not gate error; type-scale,
    shadow-layers and palette-size are real'
