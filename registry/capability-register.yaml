- id: aurelix.extractor.ui-ux-audit
  name: UI/UX architecture audit — crawl, capture, and score L1–L10
  kind: extractor
  invocation: python3 run_ui_ux_audit.py site <url> [--max-pages N] [--store-html] [--axe] [--benchmark
    <file>] [--screenshots] [--psi] | python3 run_ui_ux_audit.py urls --url <u> [--url <u> …]
  preconditions:
  - the target URL answers over HTTP from this machine — a local `npm run start` counts, the audit does
    not build or serve anything itself
  - Playwright + chromium installed for --crawl-rendering browser, --screenshots, --axe and --benchmark;
    nothing checks for it, and its absence degrades the run rather than stopping it
  - an axe.min.js on disk or AXE_JS set, for --axe. It is deliberately NOT vendored, so pinning a copy
    cannot silently freeze the ruleset
  - PAGESPEED_API_KEY for --psi (the default is 'on if the key is set')
  - 'Supabase credentials are OPTIONAL: the L1–L10 engine is pure HTML analysis, and without them the
    normative-conformance layer reports NOT_MEASURED naming the reason'
  inputs:
  - the live site, reached by same-origin BFS from the seed (site mode) or as an explicit URL list (urls
    mode)
  - <bundle>/codebase_preflight.json, when one is paired — its suggested_local_seeds are unioned into
    the crawl and its static signals merged into the findings
  - a design-DNA benchmark JSON, when --benchmark is given
  - registry/ui-ux-audit-paths.yaml — where the bundle is written when --output-dir is omitted
  - a Playwright storage-state JSON, when --storage-state is given
  - a DECLARED journey file, when --journeys is given
  outputs:
  - audit_result.yaml — THE report. findings[] is a FLAT list across all layers and pages, 13 fields each,
    with evidence[] carrying {source, page_url, selector, observed, expected, confidence, reproducibility,
    metadata}
  - remediation_tasks.yaml, and remediation_brief.md unless --no-handoff
  - captures/NNN_<hash>.json — the capture bundle. {url, http_status, fetch_error, headers, html_length},
    plus `html` ONLY under --store-html
  - captures_manifest.json — at the BUNDLE ROOT, not inside captures/
  - psi/, axe/, screenshots/, journeys/ — each written only when its flag is on
  - NOT report.json. That name belongs to the web-builder render probe, a different file with a different
    schema; this runner has never written one
  outcome: a per-rule PASS/FAIL/NOT_MEASURED score across ten layers of the live site, plus the capture
    bundle that is the pipeline's universal source-interchange format
  exit_contract:
    '0': the audit ran and the bundle was written. It says NOTHING about the site's score — a site that
      failed every rule exits 0, because this is an extractor and the verdict is inside audit_result.yaml,
      not in the exit code
    '1': 'the run could not be performed: no URLs to audit, --storage-state / --journeys / --benchmark
      file missing, an invalid journey declaration, or --axe requested and axe-core unavailable (that
      one deliberately fails the RUN, because an accessibility audit reporting zero violations it never
      measured is worse than no audit)'
    '2': argparse rejected the invocation — no subcommand, or an unknown flag
  measures:
  - 'L1–L10 heuristic rules over harvested HTML: structure, navigation, content, visual systems, accessibility,
    performance, design-system integrity, behavioural friction'
  - per-layer COVERAGE, and it suppresses the composite score below the reportable tier rather than publishing
    a number it did not earn
  - which requested routes it could NOT reach, in an explicit coverage block — every score is a score
    over `reached`, and leaving that implicit turns a verdict on a public front door into a verdict on
    the site
  - 'blank renders: a page that returned HTML and painted nothing forces the render-dependent layers to
    NOT_MEASURED, because a blank page trivially PASSES every visual and contrast rule'
  - computed style vs a declared benchmark (dna_* rules), but ONLY with --benchmark
  - real contrast, computed ARIA and focus order, but ONLY with --axe
  cannot_see:
  - 'WHERE in a page an offence is, at section granularity. There is no `section` field anywhere in the
    finding schema — compiler.py:126-154 emits exactly 13 fields and none of them is one. Measured on
    a 4-page local run: 45 findings, 45 carry a route, 0 carry a section. No consumer can route a finding
    to a section artifact'
  - WHICH element. 33 of those 45 findings did carry an evidence[].selector, but they are RULE selectors
    — 'h1', 'title', 'meta[name=description]', ':focus-visible' — describing what the rule looked for,
    not an instance a browser resolved. Only --axe emits selectors resolved against a rendered DOM, and
    --axe is OFF BY DEFAULT
  - where a dna_* conformance offence actually occurred. evaluate() flattens measured['per_page'] into
    one aggregate and stamps pages[0] onto every evidence record (design_conformance.py:484, `first =
    pages[0]`), so the page_url on those findings is 'the first page in the list', not the offending page
  - 'the dna_* rules AT ALL without --benchmark. They are then ABSENT from the report, not passed — and
    an absent rule in a findings list reads as a clean one. Measured: a default run produced 45 findings
    and 0 of them dna_*'
  - a localhost target, on the --psi path. PSI is a Google service reaching IN, so every call against
    127.0.0.1 returns HTTP 400 and lands as a NOT_MEASURED finding — and since --psi defaults to ON whenever
    PAGESPEED_API_KEY is set, a local run pays minutes of round trips to learn nothing unless you pass
    --no-psi
  - 'the HTML it fetched, unless --store-html is passed. html_length is computed in memory and ALWAYS
    persisted; `html` is persisted only under the flag, so a capture record can report html_length: 23198
    with no `html` key at all. A bundle in that shape is useless as a build source, and nothing in the
    bundle says so'
  - anything behind a login without --storage-state, and the plain fetch path carries no session at all
    — so an unauthenticated crawl scores the public site and calls it the site
  - 'whether it measured anything. There is no exit 3: a run that reached zero usable pages, ran no browser-dependent
    layer and scored almost nothing still exits 0'
  - the source code behind the rendered page — that is run_ui_codebase_preflight.py's job, and it is merged
    in only when its JSON is present in the bundle dir
  - 'capture identity by filename: slugs use Python''s builtin hash(), salted per process, so they change
    every run. Only record[''url''] is stable'
  reachable_from:
  - run_pipeline.py:803 — the `audit` stage of the vercel chain
  - web-builder/scripts/cvr_loop.py:1058 — audits the site the loop just built
  - .github/workflows/tests.yml:78 — a `urls` smoke run in CI
  - standalone CLI
  cost: 'the httpx crawl itself is seconds — 4 local pages captured and scored in under 10s. --psi dominates
