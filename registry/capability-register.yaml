  - the repo's src/app/**/page.tsx (Next.js App Router) or react-router-dom routes (Vite+React), whichever
    is found first
  - every src/**/*.tsx outside node_modules, scanned for UX / a11y / frontend-debt signals
  - vite.config.{ts,js}, for the dev-server port hint
  - package.json, for the lint script
