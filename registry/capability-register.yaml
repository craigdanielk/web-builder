    {page_id: {slot_key: {rule_id, detail, ...}}}'
  - <out-dir>/unroutable-findings.json — every finding that became no verdict, with a reason from a closed
    vocabulary, plus the counting summary
  outcome: which built sections a human-readable audit finding actually blames, and — for every finding
