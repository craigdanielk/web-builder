- id: aurelix.adapter.shopify-admin-token
  name: Step 0 — mint a Shopify Admin API token by client-credentials grant
  kind: adapter
  invocation: python3 step0_token.py [--env PATH] [--no-write]
  preconditions:
  - SHOPIFY_STORE_DOMAIN, SHOPIFY_CLIENT_ID and SHOPIFY_CLIENT_SECRET — read from the --env FILE FIRST
    and only then from os.environ (the opposite precedence to every other script here)
  - the store must have a custom app installed whose client credentials grant the requested scopes; the
    global shopify.com token endpoint returns 403, so this posts to the per-store /admin/oauth/access_token
  - network reach to https://<domain>/admin/oauth/access_token and .../admin/api/2024-01/graphql.json
  - --env defaults to <repo-root>/.env, which DOES NOT EXIST in this checkout. With no file and no ambient
    credentials it returns 1 immediately
  - the --env file must already exist for the token to be written back — a non-existent path silently
    downgrades the run to print-only
  inputs:
  - 'the --env file: SHOPIFY_STORE_DOMAIN, SHOPIFY_CLIENT_ID, SHOPIFY_CLIENT_SECRET'
  - os.environ, as a fallback for each of those three only
  - a hardcoded 30-scope request string covering products, inventory, content, themes, files, customers,
    orders, fulfillments, translations, markets, publications and online-store navigation
  outputs:
  - 'the --env file, REWRITTEN: SHOPIFY_ADMIN_ACCESS_TOKEN is updated in place or appended under a ''#
    Admin API token (Step 0; ~24h expiry)'' comment. This is a file mutation, not a print'
  - 'stdout: the reported expires_in, the verified shop name and myshopifyDomain, and the destination
    path'
  - 'stdout under --no-write: the first 20 characters of the token only'
  outcome: a live Admin API token written where every other Shopify instrument in this directory expects
    to find it — the credential that Layer 4, Layer 5 and Gate B-0 all fail without
  exit_contract:
    '0': token obtained, verified against the shop query, and (unless --no-write) written to the --env
      file
    '1': missing client credentials, the token POST failed, the response carried no 'shp'-prefixed access_token,
      or the verification shop query failed or returned GraphQL errors
    '2': usage error from argparse
  measures:
  - that the client-credentials grant is accepted by this specific store
  - that the returned token actually works, by spending it on { shop { name url myshopifyDomain } } before
    writing it anywhere
  - the expires_in the store reports (defaulting to 86400 when absent) — printed, never stored
  cannot_see:
  - WHICH SCOPES IT ACTUALLY GOT. It requests 30 scopes and never reads them back; Shopify grants only
    what the installed app is configured for and returns 200 regardless. So a token minted here can pass
    Gate B-0 and still 403 on the first write in Layer 4. Only diagnose_api_connection.py reads /admin/oauth/access_scopes.json
  - the expiry it prints is not persisted anywhere — nothing downstream can tell a token minted 30 seconds
    ago from one minted 23 hours ago, and the ~24h expiry is why this script is re-run rather than run
    once
  - 'it does not know it just overwrote a working token: the in-place rewrite has no backup and no diff,
    and if the shop query passes but the file write is interrupted the .env is left mid-rewrite'
  - it cannot see that the default --env path does not exist. `load_dotenv` returns {} for a missing file
    and the write-back branch is guarded on `args.env.exists()`, so a run against a bad path fails on
    'Missing required env' rather than on 'that file is not there'
  - the storefront (public) token, which is a different credential minted in the Shopify Admin UI and
    which Gate B needs — this script only ever produces the Admin one
  reachable_from:
  - preflight_api_keys.py:99-125 — try_refresh_shopify_token(), a subprocess call made only after an Admin
    API 401 and only when SHOPIFY_CLIENT_ID and SHOPIFY_CLIENT_SECRET are both present in the (non-existent)
    root .env
  - run_pipeline.py, transitively, via the `preflight` stage that runs preflight_api_keys.py
  - shopify-integration-layer/cli-deploy/update-scopes.sh:19 — an echoed instruction to a human, NOT an
    invocation
  cost: seconds. One token POST (30s timeout) and one verification GraphQL POST (15s timeout). It does
    not touch store data, but it DOES rewrite the --env file unless --no-write is passed. The token it
    returns lives ~24h.
  source_file: shopify-integration-layer/step0_token.py
  language: py
  status: NOT_RUN
  evidence: needs SHOPIFY_CLIENT_ID + SHOPIFY_CLIENT_SECRET + SHOPIFY_STORE_DOMAIN, all absent. It mints
    a ~24h Admin token AND rewrites the --env file in place
